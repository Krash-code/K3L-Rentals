<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login - K3L Rentals</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<header class="navbar">

    <div class="logo">
        K3L RENTALS
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="vehicles.html">
            Vehicles
        </a>

        <a href="login.html">
            User Login
        </a>

    </nav>

</header>



<div class="auth-container">

    <div class="auth-card">

        <h1>
            Admin Login
        </h1>

        <p>
            Login to access the K3L Rentals administration panel.
        </p>


        <form id="adminLoginForm">


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required>



            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                required>



            <button
                type="submit"
                class="primary-btn">

                Admin Login

            </button>


        </form>


        <p
            id="message"
            class="form-message">
        </p>


        <p>

            <a href="login.html">
                ← User Login
            </a>

        </p>


    </div>

</div>




<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Firebase Configuration -->
<script src="js/firebase-config.js"></script>

<!-- Existing JavaScript -->
<script src="js/common.js"></script>
<script src="js/admin-login.js"></script>


</body>

</html>
