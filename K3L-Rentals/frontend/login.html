<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Customer Login - K3L Rentals</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        K3L RENTALS
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="vehicles.html">
            Vehicles
        </a>

        <a
            href="login.html"
            id="loginLink">

            Login

        </a>

        <a
            href="register.html"
            id="registerLink">

            Register

        </a>

    </nav>

</header>



<div class="auth-container">

    <div class="auth-card">

        <h1>
            Customer Login
        </h1>

        <p>
            Login to book vehicles and manage your bookings.
        </p>


        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>



            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>



            <button
                type="submit"
                class="primary-btn">

                Login

            </button>


        </form>


        <p
            id="message"
            class="form-message">
        </p>


        <p>
            Don't have an account?

            <a href="register.html">
                Register
            </a>
        </p>

        <p style="margin-top: 15px; border-top: 1px solid #e2e8f0; padding-top: 12px;">
            <a href="admin-login.html" style="color: #4a5568; font-size: 0.9rem;">
                Admin Portal Login →
            </a>
        </p>

    </div>

</div>



<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>


</body>

</html>
