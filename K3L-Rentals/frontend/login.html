<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - K3L Rentals</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<header class="navbar">

    <div class="logo">
        K3L RENTALS
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="vehicles.html">
            Vehicles
        </a>

        <a
            href="login.html"
            id="loginLink">
            Login
        </a>

        <a
            href="register.html"
            id="registerLink">
            Register
        </a>

    </nav>

</header>



<div class="auth-container">

    <div class="auth-card">

        <h1>
            Login
        </h1>

        <p>
            Login to your K3L Rentals account.
        </p>


        <form id="loginForm">


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>



            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>



            <button
                type="submit"
                class="primary-btn">

                Login

            </button>


        </form>


        <p
            id="message"
            class="form-message">
        </p>


        <p>
            Don't have an account?

            <a href="register.html">
                Register
            </a>
        </p>

    </div>

</div>


<script src="js/common.js"></script>

<script src="js/login.js"></script>


</body>

</html>
