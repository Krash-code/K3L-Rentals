<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - K3L Rentals Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        🚗 K3L <span>ADMIN</span>
    </div>
    <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-verification.html">Verification</a>
        <a href="admin-vehicles.html">Vehicles</a>
        <a href="admin-bookings.html">Bookings</a>
        <a href="admin-customers.html" style="color: #60a5fa; font-weight: 600;">Customers</a>
        <a href="admin-fleet.html">Fleet</a>
        <a href="admin-maintenance.html">Maintenance</a>
        <a href="admin-reports.html">Reports</a>
        <button id="logoutBtn" class="nav-btn">Logout</button>
    </nav>
</header>

<main class="section">
    <div class="admin-page-header">
        <div>
            <h1>Registered Customers &amp; Age Compliance</h1>
            <p class="section-subtitle">
                Manage registered user accounts, verify age compliance (18+), and inspect booking history.
            </p>
        </div>
    </div>

    <!-- SEARCH -->
    <div class="admin-form-card" style="background: white; padding: 18px; border-radius: 8px; border: 1px solid var(--slate-200); margin-bottom: 24px;">
        <div class="form-grid">
            <div class="form-group">
                <label for="searchInput">Search Customers</label>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search by customer name, email address, or phone number..."
                    style="width: 100%; padding: 10px;">
            </div>
        </div>
    </div>

    <!-- CUSTOMER TABLE -->
    <div id="customerTableContainer" class="admin-table-container">
        <div class="info-card">
            <h3>Loading customer profiles...</h3>
        </div>
    </div>
</main>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/admin-customers.js"></script>

</body>
</html>
