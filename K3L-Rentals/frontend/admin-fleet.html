<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Management - K3L Rentals Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        🚗 K3L <span>ADMIN</span>
    </div>
    <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-verification.html">Verification</a>
        <a href="admin-vehicles.html">Vehicles</a>
        <a href="admin-bookings.html">Bookings</a>
        <a href="admin-customers.html">Customers</a>
        <a href="admin-fleet.html" style="color: #60a5fa; font-weight: 600;">Fleet</a>
        <a href="admin-maintenance.html">Maintenance</a>
        <a href="admin-reports.html">Reports</a>
        <button id="logoutBtn" class="nav-btn">Logout</button>
    </nav>
</header>

<main class="section">
    <div class="admin-page-header">
        <div>
            <h1>Fleet Operations &amp; Hub Distribution</h1>
            <p class="section-subtitle">
                Monitor live vehicle status, track hubs along Coimbatore, Erode, and Salem, and reassign locations.
            </p>
        </div>
        <button id="refreshFleetBtn" class="primary-btn">
            Refresh Fleet
        </button>
    </div>

    <!-- FLEET FILTERS -->
    <div class="admin-form-card" style="background: white; padding: 18px; border-radius: 8px; border: 1px solid var(--slate-200); margin-bottom: 24px;">
        <div class="form-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px;">
            <div class="form-group">
                <label for="searchInput">Search Vehicle</label>
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search model or registration number..."
                    style="width: 100%; padding: 8px;">
            </div>

            <div class="form-group">
                <label for="statusFilter">Status Filter</label>
                <select id="statusFilter" style="width: 100%; padding: 8px;">
                    <option value="all">All Statuses</option>
                    <option value="available">Available</option>
                    <option value="booked">Booked</option>
                    <option value="in_use">In Use</option>
                    <option value="maintenance">Maintenance</option>
                </select>
            </div>

            <div class="form-group">
                <label for="locationFilter">Hub Location</label>
                <select id="locationFilter" style="width: 100%; padding: 8px;">
                    <option value="all">All Locations</option>
                </select>
            </div>
        </div>
    </div>

    <!-- FLEET TABLE -->
    <div id="fleetTableContainer" class="admin-table-container">
        <div class="info-card">
            <h3>Loading fleet inventory...</h3>
        </div>
    </div>
</main>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/admin-fleet.js"></script>

</body>
</html>
