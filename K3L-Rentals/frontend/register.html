<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - K3L Rentals</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<header class="navbar">

    <div class="logo">
        K3L RENTALS
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="vehicles.html">
            Vehicles
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>



<div class="auth-container">

    <div class="auth-card">

        <h1>
            Create Account
        </h1>

        <p>
            Register to start renting vehicles.
        </p>


        <form id="registerForm">


            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required>



            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>



            <label for="phone">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                placeholder="Enter your phone number">



            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required>



            <button
                type="submit"
                class="primary-btn">

                Register

            </button>


        </form>


        <p
            id="message"
            class="form-message">
        </p>


        <p>

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="js/common.js"></script>

<script src="js/register.js"></script>


</body>

</html>
